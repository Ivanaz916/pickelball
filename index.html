<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friendly Pickleball Tournament</title>
  <style>
    :root { color-scheme: light; --navy: #0d2c54; --blue: #1565c0; --sky: #e3f2fd; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--navy);
      background: linear-gradient(145deg, var(--sky), #fff);
    }
    main { width: min(760px, 100%); text-align: center; }
    h1 { font-weight: 400; margin-bottom: 8px; }
    p { color: #456; margin-bottom: 28px; }
    .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
    a {
      display: block;
      padding: 28px 20px;
      border-radius: 14px;
      color: var(--navy);
      background: #fff;
      box-shadow: 0 5px 20px rgba(13, 44, 84, .12);
      text-decoration: none;
      font-size: 1.15rem;
      border-top: 4px solid #4fc3f7;
    }
    a:hover, a:focus { color: var(--blue); transform: translateY(-2px); }
    small { display: block; margin-top: 8px; color: #6787a5; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <h1>Friendly Pickleball Tournament</h1>
    <p>Sunday Oct 11, 4 PM<br>Grove Street Tennis Courts</p>
    <div class="links">
      <a href="pickleball-rules.html">Pickleball Rules<small>View the rules and how to play</small></a>
      <a href="pickleball-tournament.html">Tournament Organizer<small>Create teams, pools, schedules, and brackets</small></a>
    </div>
  </main>
</body>
</html>
